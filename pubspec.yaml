name: android_dev
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  
  path: ^1.9.1
  retrofit: ^4.10.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4

dev_dependencies:
  build_runner: ^2.4.14

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.9
  

flutter:
  uses-material-design: true

assets:
  - assets/images/

fonts:
  - family: gilroy-font
    fonts:
      - asset: assets/fonts/gilroy-font/Gilroy-FREE/Gilroy-ExtraBold.otf
        weight: 700
      - asset: assets/fonts/gilroy-font/Gilroy-FREE/Gilroy-Light.otf
        weight: 500
